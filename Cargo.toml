[workspace]
resolver = "2"
members = ["crates/transport", "crates/protocol", "crates/host", "crates/cli", "crates/acp-probe", "crates/push-relay"]
exclude = ["app"]  # the Tauri phone app is its own Cargo workspace (app/src-tauri)

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
authors = ["Corvux Mindware"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
postcard = { version = "1", features = ["alloc"] }
async-trait = "0.1"
# crypto (forked transport layer)
#
# Moved as ONE set: these share `digest` 0.11 / `crypto-common` 0.2, so a partial
# bump compiles two incompatible trait generations into the same binary. The
# target is what iroh already uses - before this, `portty-transport` linked
# ed25519-dalek 2 while iroh linked 3, i.e. two Ed25519 stacks in one crate.
#
# Derived key bytes are unchanged by design: every label is an explicit byte
# string fed to HKDF-SHA256 (RFC 5869), HMAC-SHA256 (RFC 2104),
# ChaCha20-Poly1305 (RFC 8439) and Ed25519 (RFC 8032). Those outputs are fixed
# by the standards, not by the crate version, so existing pairings still verify.
ed25519-dalek = { version = "3", features = ["rand_core"] }
# `getrandom` gates `EphemeralSecret::random()`, which draws the ephemeral DH
# secret straight from the OS. Without it the only constructor takes an
# infallible `CryptoRng`, which rand 0.10's fallible `SysRng` cannot satisfy.
x25519-dalek = { version = "3", features = ["getrandom"] }
chacha20poly1305 = "0.11"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
blake3 = "1"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
rand = "0.10"
hex = "0.4"

# Optimize DEPENDENCIES even in dev builds (crypto/serde are 10-50x slower at
# opt-level 0; the daemon streams encrypted terminal bytes through them). Own
# crates stay unoptimized for fast incremental builds and honest debugging.
[profile.dev.package."*"]
opt-level = 3
