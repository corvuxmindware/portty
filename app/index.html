<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Portty is a fixed app shell, so the WKWebView viewport itself must not
         scale. The terminal implements its own bounded font zoom, keeping the
         shell readable without also enlarging headers, forms, and home UI. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Portty</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
