# Config for `cargo about generate about.hbs -o THIRD-PARTY-NOTICES.txt`.
# Produces the open-source license notices bundled in the release archives.
# Regenerate on every release (dependency set can change) and commit the result.

# Only consider the license situation for the binaries we actually ship.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

# Don't fail the build for a workspace-internal crate that has no published deps.
workarounds = ["ring"]

# Licenses we accept for bundled dependencies (permissive + weak-copyleft).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "OpenSSL",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
