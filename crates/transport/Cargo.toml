[package]
name = "portty-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Portty secure transport - forked from Corvux sync (iroh + pairing + crypto + identity)."

[dependencies]
serde = { workspace = true }
postcard = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
iroh = { version = "1", default-features = false, features = ["tls-ring"] }
base64 = "0.22"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW for credential reads (see `secure::open_no_follow`).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # MoveFileExW + MOVEFILE_WRITE_THROUGH: durable credential replacement, since
    # Windows has no directory-fsync equivalent (see `secure::replace_durably`).
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
portty-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
